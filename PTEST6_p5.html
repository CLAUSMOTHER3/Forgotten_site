<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/addons/p5.sound.min.js"></script>
    <meta charset="utf-8">
    <link rel="icon" href="image/site_icon.ico"/> 
<style
html, body {
  margin: 0;
  padding: 20;
}
canvas {
  display: block;
}
>
</style>
<title>THE WORLDS HARDEST GAME</title>
<link rel="stylesheet" herf="style.css" />  
</head>

<script>
// START ==========================================================================================
// Test your eyes


let pressedKeys = {};
let mus_hard;
let cantstop = false;
function preload() {
  soundFormats('mp3', 'ogg');
  // imageFormats('gif');
  mus_hard = loadSound('/sound/itshard.ogg');
}

function setup() {
  let cnv = createCanvas(600, 600);
  cnv.mousePressed(canvasPressed);
  player = new Player(width/2 -13, height/2 -75);
  obstacle = new Obstacle(width/2, 200);
}
// add a spawn point
function canvasPressed() {

  if (cantstop === false)
  {
    background(10, 5, 20);
    mus_hard.loop();
    mus_hard.setVolume(1.0);
    frameRate(60);
    
    cantstop = true;
  }
}

function draw() {
  background(224, 220, 255);
  //checkerboard
  fill(248, 248, 255);
  stroke(0);
  strokeWeight(0);
  for (var x = 40; x <=width; x += 80){
    for (var y = 40;  y <= height; y+=80){
      rect(x, y, 40, 40);
    }
  }
  for (var x = 0; x <= width; x += 80){
    for (var y = 0;  y <= height; y += 80){
      rect(x, y, 40, 40);
    }
  }

  // movement
  player.update();
  player.draw();
  obstacle.draw();
  obstacle.update();

  
  // UI
  fill(20, 0, 60)
  stroke(20,0, 180);
  strokeWeight(5);
  rect(0, height-80, 600, 80);
}

function keyPressed() {
  pressedKeys[key] = true;
}

function keyReleased() {
  delete pressedKeys[key];
}

class Player {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.scale = 25;
    this.w = this.scale;
    this.h = this.scale;
    this.speed = 3;
  }
  
  update() {
    let mvmt = createVector(0, 0);
    
    if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) {
      mvmt.x -= 1;
    }
    if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) {
      mvmt.x += 1;
    }
    if (keyIsDown(UP_ARROW) || keyIsDown(87)) {
      mvmt.y -= 1;
    }
    if (keyIsDown(DOWN_ARROW) || keyIsDown(83)) {
      mvmt.y += 1;
    }
    
    mvmt.setMag(this.speed);
    
    // borders
    if(this.x < 0){
      this.x = this.x + this.speed*1.05;
    }
    if(this.x > width - this.scale){
      this.x = this.x - this.speed*1.05;
    }

    if(this.y < 0){
      this.y = this.y + this.speed*1.05;
    }
    if(this.y > height - this.scale -80){
      this.y = this.y - this.speed*1.05;
    }

    this.x += mvmt.x;
    this.y += mvmt.y;
  }
  
  draw() {
    stroke(120, 0, 0);
    strokeWeight(5)
    fill(255, 0, 0);
    rect(this.x, this.y, this.w, this.h);
  }
}
// OBSTACLE  CLASS --------------------------------
class Obstacle {
  constructor(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.scale = 15;
    this.w = this.scale;
    this.h = this.scale;
    this.speed = 0.05;
  }
  
  update() {
    this.y = 3 * sin(frameCount * this.speed) + this.y;

     // borders
    if(this.x < 0){
      this.x = this.x + this.speed*1.05;
    }
    if(this.x > width - this.scale){
      this.x = this.x - this.speed*1.05;
    }

    if(this.y < 0){
      this.y = this.y + this.speed*1.05;
    }
    if(this.y > height - this.scale){
      this.y = this.y - this.speed*1.05;
    }
  }
  
  draw() {
    stroke(0, 0, 120);
    strokeWeight(5)
    fill(0, 0, 255);
    circle(this.x, this.y, this.w, this.h);
  }
}


// END ==========================================================================================
</script>

  </head>
  <body>
    <p> THE WORLDS HARDEST.</p>
  </body>
</html>
